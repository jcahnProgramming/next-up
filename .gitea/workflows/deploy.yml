# Redeploys Next Up on <HOST> on every push to main. Modeled on home-dashboard's deploy.yml; the runner,
# Gitea and its settings are used as they are.
#
# How it reaches the host: the job container can see <HOST>'s Docker daemon (the
# runner passes its mounted /var/run/docker.sock into job containers), but NOT
# <HOST>'s filesystem. So every step that touches the deployment launches a
# short-lived helper container through that daemon and bind-mounts the host
# path into it. The host daemon resolves bind mounts against the host
# filesystem, which is what makes this operate on the real deployment.
#
# The deploy dir is mounted at the SAME path inside the helpers. That way the
# relative `./data` volume in docker-compose.yml resolves to the real host path
# when compose passes it back to the daemon.
#
# Hard constraints (see README "Deploy"):
#   - never create, overwrite or modify .env (the workflow checks its hash before and after)
#   - never delete, reset or chown ./data
#   - never `git reset --hard` / `git clean`; fast-forward only

name: Deploy to <HOST>

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_DIR: <DEPLOY_DIR>
  # Internal bridge address of Gitea. The tailnet hostname does not resolve from containers.
  GITEA_INTERNAL_URL: <GITEA_INTERNAL_URL>
  # The ports are published on <HOST>'s LAN address only (docker-compose.yml), so that is where they are probed:
  # 127.0.0.1 would never answer.
  HOST_IP: <LAN_IP>
  WEB_PORT: "3230"
  MCP_PORT: "3231"
  WEB_CONTAINER: next-up
  MCP_CONTAINER: next-up-mcp
  APP_IMAGE: next-up:local
  GIT_IMAGE: alpine/git:latest
  DOCKER_IMAGE: docker:cli

jobs:
  deploy:
    runs-on: ubuntu-latest
    # docker:cli ships the docker CLI + compose plugin and nothing else we depend on.
    container:
      image: docker:cli
    defaults:
      run:
        shell: sh
    timeout-minutes: 20
    steps:
      - name: Preflight — host Docker daemon and deploy dir
        run: |
          set -eu
          if ! docker version >/dev/null 2>&1; then
            echo "::error::No Docker daemon reachable from the job container."
            echo "The runner must pass its docker.sock into job containers."
            echo "In act_runner's config.yaml, container.docker_host must be empty or 'automount', not '-'."
            exit 1
          fi
          echo "Docker daemon: $(docker info --format '{{.Name}} / {{.ServerVersion}}')"

          # --mount (unlike -v) FAILS if the host path does not exist instead of
          # silently creating an empty directory.
          docker run --rm \
            --mount "type=bind,source=$DEPLOY_DIR,target=$DEPLOY_DIR,readonly" \
            -w "$DEPLOY_DIR" --entrypoint sh "$GIT_IMAGE" -c '
              set -eu
              missing=0
              for f in .git docker-compose.yml Dockerfile .env data; do
                if [ ! -e "$f" ]; then echo "::error::$PWD/$f not found on host"; missing=1; fi
              done
              [ "$missing" = 0 ] || exit 1
              echo "Host deploy dir OK: $PWD"
              echo ".env sha256: $(sha256sum .env | cut -d" " -f1)"
            '

      - name: Record .env fingerprint
        run: |
          set -eu
          docker run --rm \
            --mount "type=bind,source=$DEPLOY_DIR,target=$DEPLOY_DIR,readonly" \
            -w "$DEPLOY_DIR" --entrypoint sh "$GIT_IMAGE" -c 'sha256sum .env | cut -d" " -f1' > /tmp/env.sha
          echo "Recorded .env fingerprint."

      - name: Pull latest main into host working copy (fast-forward only)
        env:
          GIT_TOKEN: ${{ gitea.token }}
          REPO_PATH: ${{ gitea.repository }}
          PUSHED_SHA: ${{ gitea.sha }}
        run: |
          set -eu
          # Fetch from Gitea's internal address explicitly, because the clone's own
          # `origin` URL may use the tailnet hostname that containers can't resolve.
          # The token travels in an env var and an http header, never in argv or .git/config.
          docker run --rm \
            --mount "type=bind,source=$DEPLOY_DIR,target=$DEPLOY_DIR" \
            -w "$DEPLOY_DIR" \
            -e GIT_TOKEN -e REPO_PATH -e PUSHED_SHA -e GITEA_INTERNAL_URL \
            --entrypoint sh "$GIT_IMAGE" -c '
              set -eu
              git config --global --add safe.directory "$PWD"
              auth="Authorization: Basic $(printf "x-access-token:%s" "$GIT_TOKEN" | base64 | tr -d "\n")"

              branch=$(git rev-parse --abbrev-ref HEAD)
              if [ "$branch" != "main" ]; then
                echo "::error::Host working copy is on branch \"$branch\", expected main. Refusing to deploy."
                exit 1
              fi
              if ! git diff --quiet || ! git diff --cached --quiet; then
                echo "::error::Host working copy has local modifications to tracked files. Refusing to deploy:"
                git status --short --untracked-files=no
                exit 1
              fi

              before=$(git rev-parse HEAD)
              git -c http.extraHeader="$auth" fetch --no-tags "$GITEA_INTERNAL_URL/$REPO_PATH.git" main
              git merge --ff-only FETCH_HEAD
              # Keep origin/main in step so `git status` on the host stays accurate.
              if git remote get-url origin >/dev/null 2>&1; then
                git update-ref refs/remotes/origin/main FETCH_HEAD
              fi
              after=$(git rev-parse HEAD)

              echo "Deployed commit: $before -> $after"
              if [ "$after" != "$PUSHED_SHA" ]; then
                echo "::warning::HEAD ($after) differs from the pushed commit ($PUSHED_SHA). A newer push is probably on main already."
              fi
            '

      - name: Rebuild and restart stack
        run: |
          set -eu
          docker run --rm \
            --mount "type=bind,source=$DEPLOY_DIR,target=$DEPLOY_DIR" \
            --mount "type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock" \
            -w "$DEPLOY_DIR" "$DOCKER_IMAGE" \
            docker compose up -d --build

      - name: Verify web and MCP are healthy, stable and on the new version
        run: |
          set -eu
          web="http://$HOST_IP:$WEB_PORT"
          mcp="http://$HOST_IP:$MCP_PORT"
          # Probes run in a helper on the HOST network, so they reach the ports exactly where they are published.
          probe() {
            docker run --rm --network host "$DOCKER_IMAGE" \
              sh -c "wget -q -S -O /dev/null '$1' 2>&1 | grep -q 'HTTP/1.1 200'"
          }
          running() {
            [ "$(docker inspect -f '{{.State.Running}} {{.State.Restarting}}' "$1" 2>/dev/null)" = "true false" ]
          }

          ok=0
          for i in $(seq 1 30); do
            web_health=fail; web_ui=fail; mcp_health=fail
            probe "$web/health" && web_health=ok || true
            probe "$web/" && web_ui=ok || true
            probe "$mcp/health" && mcp_health=ok || true
            echo "attempt $i: web /health=$web_health  web /=$web_ui  mcp /health=$mcp_health"
            if [ "$web_health$web_ui$mcp_health" = okokok ] && running "$WEB_CONTAINER" && running "$MCP_CONTAINER"; then
              ok=1; break
            fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo "::error::Services did not become healthy within ~90s."; exit 1; }

          # Catch crash loops that answer once and then die: the restart counts must stay flat.
          r1="$(docker inspect -f '{{.RestartCount}}' "$WEB_CONTAINER") $(docker inspect -f '{{.RestartCount}}' "$MCP_CONTAINER")"
          sleep 15
          r2="$(docker inspect -f '{{.RestartCount}}' "$WEB_CONTAINER") $(docker inspect -f '{{.RestartCount}}' "$MCP_CONTAINER")"
          if [ "$r1" != "$r2" ] || ! running "$WEB_CONTAINER" || ! running "$MCP_CONTAINER"; then
            echo "::error::A container restarted after coming up (restart counts $r1 -> $r2). Likely a crash loop."
            exit 1
          fi
          probe "$web/health" || { echo "::error::web stopped responding"; exit 1; }
          probe "$mcp/health" || { echo "::error::MCP stopped responding"; exit 1; }

          # Both containers must report the version in the CHANGELOG.json that was just pulled: anything else means
          # an old container is still answering.
          expected=$(docker run --rm \
            --mount "type=bind,source=$DEPLOY_DIR/CHANGELOG.json,target=/c.json,readonly" \
            --entrypoint node "$APP_IMAGE" -p "JSON.parse(require('fs').readFileSync('/c.json','utf8')).releases[0].version")
          for url in "$web/health" "$mcp/health"; do
            body=$(docker run --rm --network host "$DOCKER_IMAGE" wget -q -O - "$url")
            case "$body" in
              *"\"version\":\"$expected\""*) echo "$url reports $expected" ;;
              *) echo "::error::$url answered $body, expected version $expected."; exit 1 ;;
            esac
          done
          echo "Both services healthy, stable and on $expected."

      - name: Confirm .env untouched
        if: always()
        run: |
          set -eu
          [ -s /tmp/env.sha ] || { echo "No fingerprint recorded (earlier step failed); skipping."; exit 0; }
          now=$(docker run --rm \
            --mount "type=bind,source=$DEPLOY_DIR,target=$DEPLOY_DIR,readonly" \
            -w "$DEPLOY_DIR" --entrypoint sh "$GIT_IMAGE" -c 'sha256sum .env | cut -d" " -f1')
          if [ "$now" != "$(cat /tmp/env.sha)" ]; then
            echo "::error::.env on <HOST> changed during the deploy. This must never happen. Investigate."
            exit 1
          fi
          echo ".env unchanged."

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker run --rm \
            --mount "type=bind,source=$DEPLOY_DIR,target=$DEPLOY_DIR,readonly" \
            --mount "type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock" \
            -w "$DEPLOY_DIR" "$DOCKER_IMAGE" \
            sh -c 'docker compose ps -a; echo; docker compose logs --no-color --tail=150' || true
