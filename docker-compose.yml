# Next Up: web app (UI + API) and MCP server (read-only AI access), each in its own container.
# Both run from the same image and share one SQLite file: ./data → /data. Keep ./data on a local disk, not a
# network or FUSE share (SQLite's file locking isn't dependable there).
#
# The web app is meant to be public, behind a reverse proxy or tunnel. The MCP server is not: keep it off the
# proxy and reachable only from your own network.
#
# Host ports bind to BIND_IP ONLY, never 0.0.0.0 (server/test/compose-guard.test.js). BIND_IP is required and has
# no default: set it in the shell or in .env next to this file to the host address your proxy reaches the app on
# (127.0.0.1 for this machine only). Without it, compose refuses to start rather than guess.
# Inside each container the process listens on all of the container's own interfaces; that is what Docker
# forwards the published port to, and it is not reachable any other way. For development, use `npm run dev`.

x-common: &common
  build: .
  image: next-up:local
  restart: unless-stopped
  # Container user (default 1000:1000). Set PUID/PGID in .env to match the owner of ./data.
  user: "${PUID:-1000}:${PGID:-1000}"
  env_file:
    - path: .env
      required: false
  volumes:
    - ./data:/data

services:
  next-up:
    <<: *common
    container_name: next-up
    command: ["node", "server/index.js"]
    environment:
      DATA_DIR: /data
      PORT: 3230
      BACKUP_DIR: /backups
    # Nightly backups (server/core/backup.js, RESTORE.md) go to the host folder in BACKUP_DIR (shell or .env),
    # ideally on a different disk from ./data. Required, no default. The folder must already exist, owned by
    # PUID:PGID: Docker must never create it (it would be root's). The deploy's preflight checks it before anything
    # is restarted. Inside the container it is always /backups (the BACKUP_DIR below, which the app reads).
    volumes:
      - ./data:/data
      - type: bind
        source: "${BACKUP_DIR:?Set BACKUP_DIR to the host folder for nightly backups (see docker-compose.yml)}"
        target: /backups
        bind:
          create_host_path: false
    ports:
      - "${BIND_IP:?Set BIND_IP to the host address to publish on (see docker-compose.yml)}:3230:3230"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3230/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  next-up-mcp:
    <<: *common
    container_name: next-up-mcp
    command: ["node", "server/mcp/index.js"]
    environment:
      DATA_DIR: /data
      MCP_PORT: 3231
    ports:
      - "${BIND_IP:?Set BIND_IP to the host address to publish on (see docker-compose.yml)}:3231:3231"
    depends_on:
      next-up:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3231/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
